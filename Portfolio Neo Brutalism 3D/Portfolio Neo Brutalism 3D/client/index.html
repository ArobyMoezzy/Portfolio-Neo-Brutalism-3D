    <script>
      // Terapkan tema sebelum render agar tidak berkedip
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Tandai intro film sedang diputar (kecuali sudah ditonton di sesi ini)
      try {
        if (sessionStorage.getItem('intro-seen') !== '1') document.documentElement.dataset.intro = 'playing';
      } catch (e) {
        document.documentElement.dataset.intro = 'playing';
      }
    </script>
    <style>html[data-intro='playing'] body { background: #0b0a09; }</style>
